name: Flutter Deployment

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # ============================================================
  # FLUTTER WEB
  # ============================================================

  build-web:
    name: Build Flutter Web
    runs-on: ubuntu-latest

    # Do not deploy GitHub Pages when the workflow was triggered
    # by a version tag such as v1.0.0.
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6

      # --------------------------------------------------------
      # Flutter setup
      # --------------------------------------------------------

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: flutter pub get

      # --------------------------------------------------------
      # Build Flutter Web
      # --------------------------------------------------------

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/"

      # --------------------------------------------------------
      # GitHub Pages
      # --------------------------------------------------------

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  # ============================================================
  # ANDROID APK
  # ============================================================

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6

      # --------------------------------------------------------
      # Flutter setup
      # --------------------------------------------------------

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------

      - name: Install dependencies
        run: flutter pub get

      # ========================================================
      # ANDROID SIGNING
      # ========================================================

      # Restore the keystore that is intentionally excluded
      # from Git using .gitignore.
      #
      # Required GitHub Secret:
      # ANDROID_KEYSTORE_BASE64

      - name: Restore Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      # Create android/key.properties dynamically.
      #
      # Required GitHub Secrets:
      # ANDROID_KEYSTORE_PASSWORD
      # ANDROID_KEY_PASSWORD
      # ANDROID_KEY_ALIAS

      - name: Create Android key.properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      # --------------------------------------------------------
      # Build signed release APK
      # --------------------------------------------------------

      - name: Build Android APK
        run: flutter build apk --release

      # --------------------------------------------------------
      # Upload APK as GitHub Actions artifact
      # --------------------------------------------------------

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # ========================================================
      # GITHUB RELEASE
      # ========================================================

      # Only create a public GitHub Release when this workflow
      # was triggered using a version tag such as:
      #
      # v1.0.0
      # v1.0.1
      # v1.1.0
      #
      # Normal pushes to main will NOT create a release.

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "build/app/outputs/flutter-apk/app-release.apk#app-release.apk" \
            --title "${{ github.ref_name }}" \
            --generate-notes